name: build-push-ecr-workload

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "demo-workload/**"
      - ".github/workflows/build-push-ecr-workload.yml"

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: aiops-agentcore-workload

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: build-push-ecr-workload
  cancel-in-progress: false

jobs:
  unit-test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo-workload/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r demo-workload/requirements-dev.txt

      - name: Run app tests
        run: pytest demo-workload/tests

  build-push:
    name: build and push
    needs: unit-test # build push only when unit test get passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_ECR_OIDC }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: demo-workload
          platforms: linux/amd64 # match the EKS nodes
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          echo "Pushed \`${ECR_REPOSITORY}:latest\` and \`${ECR_REPOSITORY}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
