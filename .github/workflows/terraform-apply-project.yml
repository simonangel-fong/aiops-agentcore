name: terraform-apply-project

# Applies the project-level Terraform module (ECR repositories, project bucket,
# GitHub OIDC roles). Pull requests get a plan only; master applies.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/project/**"
      - ".github/workflows/terraform-apply-project.yml"
  push:
    branches: [master]
    paths:
      - "infra/project/**"
      - ".github/workflows/terraform-apply-project.yml"

env:
  AWS_REGION: ca-central-1
  TF_WORKING_DIR: infra/project
  # Terraform is noisy about colour codes in Actions logs.
  TF_IN_AUTOMATION: "true"

# OIDC federation into AWS; no long-lived keys.
permissions:
  id-token: write
  contents: read
  pull-requests: write

# State is a shared resource: never let two applies overlap.
concurrency:
  group: terraform-apply-project
  cancel-in-progress: false

jobs:
  terraform:
    name: plan and apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_GH_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
          # Plan output is parsed below; the wrapper would mangle it.
          terraform_wrapper: false

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Publish plan to summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          {
            echo '### Terraform plan'
            echo '```terraform'
            # Step summaries cap at 1 MiB; a long plan would drop the whole block.
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        # Applies only from master, never from a pull request.
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publish outputs
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          {
            echo '### Outputs'
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
